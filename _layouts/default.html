<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: "The Umami Studio Legal" }}</title>
    <link rel="icon" type="image/png" href="/assets/images/audio-rescue-icon.png">
    <link rel="stylesheet" href="/assets/css/studio.css">
    <script>
      (function(){
        var t = localStorage.getItem('ums-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      /* Markdown specific neo-brutalism styling */
      .legal-content h1 { font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 900; text-transform: uppercase; margin-bottom: 24px; color: #111827; background: var(--accent-orange); display: inline-block; padding: 8px 16px; border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--border-color); }
      .legal-content h2 { font-size: 1.8rem; font-weight: 900; margin: 48px 0 16px; text-transform: uppercase; color: var(--text-1); }
      .legal-content p { font-size: 1.1rem; font-weight: 600; color: var(--text-2); margin-bottom: 24px; line-height: 1.7; }
      .legal-content ul, .legal-content ol { margin-bottom: 24px; padding-left: 24px; font-size: 1.1rem; font-weight: 600; color: var(--text-2); }
      .legal-content li { margin-bottom: 8px; }
      .legal-content strong { color: var(--text-1); font-weight: 800; }
      .legal-content a { color: var(--text-1); text-decoration: none; font-weight: 800; border-bottom: 3px solid var(--accent-blue); transition: all 0.2s; }
      .legal-content a:hover { background: var(--accent-blue); color: #111827; }
      [data-theme="dark"] .legal-content a:hover { color: #111827; }
      
      .legal-section {
        padding: 140px 0 80px;
        background: var(--bg-color);
        min-height: 100vh;
      }
      .legal-inner {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 24px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- ── NAV ── -->
    <nav class="nav" id="mainNav">
      <a href="/" class="nav-logo">The Umami Studio</a>
      <div class="nav-right">
        <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </nav>

    <!-- ── CONTENT ── -->
    <section class="legal-section">
      <div class="legal-inner legal-content">
        {{ content }}
      </div>
    </section>

    <script>
      var html = document.documentElement;
      var btn = document.getElementById('themeBtn');
      var icon = document.getElementById('themeIcon');
      function applyTheme(t) {
        html.setAttribute('data-theme', t);
        icon.textContent = t === 'dark' ? '🌙' : '☀️';
        localStorage.setItem('ums-theme', t);
      }
      applyTheme(html.getAttribute('data-theme') || 'light');
      btn.addEventListener('click', function() {
        applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    </script>
  </body>
</html>
